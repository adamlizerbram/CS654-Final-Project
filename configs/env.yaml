# highway-fast-v0 defaults (highway-env 1.12.1), pinned so every method sees the same task.
id: highway-fast-v0
config:
  observation:
    type: Kinematics
  action:
    type: DiscreteMetaAction
  simulation_frequency: 5
  policy_frequency: 1
  lanes_count: 3
  vehicles_count: 20
  vehicles_density: 1
  duration: 30
  ego_spacing: 1.5
  collision_reward: -1
  right_lane_reward: 0.1
  high_speed_reward: 0.4
  lane_change_reward: 0
  reward_speed_range: [20, 30]
  normalize_reward: true
  offroad_terminal: false
